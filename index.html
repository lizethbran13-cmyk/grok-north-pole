<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e11d48">
<title>Grok North Pole Village</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="hTL"><div id="hArea" class="chip">❄️ North Pole Village</div><div id="hSanta" class="chip" style="pointer-events:auto;cursor:pointer;margin-top:5px;display:table;background:rgba(160,20,40,.7)">🎅 Santa</div><div id="hGoal"></div><div id="hPlayers"></div></div>
  <div id="hTR"></div>
  <button id="hPause" aria-label="pause">II</button>
  <div id="hTimer" class="hidden"></div>
</div>
<div id="touch" class="hidden">
  <div id="touchZone"></div><div id="stickRing"></div><div id="stickKnob"></div>
  <button class="tb" id="tJump" data-b="jump">JUMP</button>
  <button class="tb" id="tSpin" data-b="spin">🌀<small>SPIN</small></button>
  
  <button class="tb hidden" id="tHook" data-b="hook">🪝</button>
  <button class="hidden" id="tAct" data-b="act"></button>
</div>
<div id="dlg"></div>
<div id="fade"></div>
<div id="ui"></div>
<div id="toast"></div>
<div id="loading"><div class="lg">GROK<br><span>NORTH POLE</span></div><div class="bar"><i id="loadBar"></i></div><p id="loadTxt">Loading…</p></div>
<script type="module" src="js/np2/main2.js?v=r5"></script>
</body>
</html>
